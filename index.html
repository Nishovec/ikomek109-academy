const modules=[
[['Знакомство с iKOMEK109','iKOMEK109 қызметімен танысу'],['Оператор принимает и классифицирует обращения. Инспектор координирует исполнение, а ответственная служба выполняет работы. Каналы включают номер 109, сайт, приложение и Telegram.','Оператор өтінішті қабылдап, жіктейді. Инспектор орындалуын үйлестіреді, ал жауапты қызмет жұмысты орындайды. Арналарға 109, сайт, қолданба және Telegram кіреді.'],['Житель сообщает об открытом люке. Кто выполняет работы на месте?','Тұрғын ашық құдық туралы хабарлады. Оқиға орнында кім жұмыс істейді?'],['Ответственная служба','Жауапты қызмет'],['Оператор','Оператор']],
[['Общение с жителем','Тұрғынмен сөйлесу'],['Поздоровайтесь, уточните цель и обстоятельства, переформулируйте запрос. При недовольстве спокойно назовите дальнейшее действие и проверьте, понятно ли оно.','Амандасыңыз, мақсат пен жағдайды нақтылаңыз. Наразылық болса, келесі әрекетті сабырмен түсіндіріп, оның түсінікті болғанын тексеріңіз.'],['«У нас опять ничего не работает». С чего начать?','«Бізде тағы ештеңе істемейді». Неден бастау керек?'],['Уточнить, что именно и где не работает','Ненің және қай жерде істемейтінін нақтылау'],['Сразу назначить исполнителя','Бірден орындаушыны тағайындау']],
[['Консультации и база знаний','Кеңес және білім базасы'],['Ищите утверждённый материал по теме, сверяйте источник и дату проверки. Темы включают медицину, транспорт, образование и единый платёжный документ.','Тақырыпқа сай бекітілген материалды тауып, дереккөз бен тексерілген күнін қараңыз. Тақырыптар: медицина, көлік, білім және бірыңғай төлем құжаты.'],['«Как оплатить проезд?» Где проверить ответ?','«Жолақыны қалай төлеймін?» Жауапты қайдан тексересіз?'],['В актуальной карточке базы знаний','Білім базасының өзекті карточкасынан'],['По памяти из старого разговора','Бұрынғы әңгімеден есте қалған мәлімет бойынша']],
[['Городские заявки','Қалалық өтінімдер'],['Для воды, света, отопления, лифтов, уборки и дорог уточните адрес, ориентир и масштаб. Различайте консультацию, инцидент, жалобу, предложение и благодарность.','Су, жарық, жылу, лифт, тазалық пен жол бойынша мекенжайды, бағдарды және ауқымды нақтылаңыз. Кеңес, оқиға, шағым, ұсыныс пен алғысты ажыратыңыз.'],['«Нет воды». Что влияет на выбор исполнителя?','«Су жоқ». Орындаушыны таңдауға не әсер етеді?'],['Адрес и масштаб отключения','Мекенжай және ажырату ауқымы'],['Длина разговора','Әңгіме ұзақтығы']],
[['Срочные и повторные обращения','Шұғыл және қайталама өтініштер'],['При угрозе жизни или здоровью уточните место и действуйте по утверждённому срочному сценарию. При повторном контакте проверьте предыдущую заявку и её статус.','Өмірге немесе денсаулыққа қауіп төнсе, орнын анықтап, бекітілген шұғыл тәртіппен әрекет етіңіз. Қайта жүгінсе, алдыңғы өтінім мен мәртебесін тексеріңіз.'],['«В лифте застрял человек». Что делать после уточнения места?','«Лифтте адам қалып қойды». Орынды нақтылаған соң не істейсіз?'],['Передать по срочному сценарию','Шұғыл тәртіппен жолдау'],['Оставить до следующей смены','Келесі ауысымға қалдыру']],

];

[['Как оплатить проезд?','Жолақыны қалай төлеймін?'],['Транспорт','Көлік'],['Первый раз еду городским автобусом.','Қалалық автобусқа алғаш рет мінемін.'],['Уточните вид транспорта и способ оплаты.','Көлік түрін және төлем тәсілін нақтылаңыз.'],['Обычный городской автобус, карты нет.','Қалалық автобус, көлік картам жоқ.'],['Проверьте актуальные способы оплаты и тариф на ресурсах CTS.','CTS ресурстарынан қолданыстағы төлем тәсілдері мен тарифті тексеріңіз.'],0,0,0],
[['У нас в доме нет воды','Үйімізде су жоқ'],['Водоснабжение','Сумен жабдықтау'],['С утра нет холодной воды.','Таңнан бері суық су жоқ.'],['Уточните адрес, вид воды и масштаб.','Мекенжайды, судың түрін және ауқымын нақтылаңыз.'],['Учебная, 12. Во всём доме нет холодной воды с 9:00.','Оқу көшесі, 12. Бүкіл үйде 9:00-ден суық су жоқ.'],['Проверьте сведения об отключениях. Если требуется вмешательство, оформите заявку по классификатору.','Ажыратулар туралы мәліметті тексеріңіз. Қажет болса, жіктеуіш бойынша өтінім рәсімдеңіз.'],1,0,1],
[['В лифте застрял человек','Лифтте адам қалып қойды'],['Лифты','Лифттер'],['В лифте застрял человек.','Лифтте адам қалып қойды.'],['Уточните адрес, подъезд и состояние человека.','Мекенжайды, кіреберісті және адамның жағдайын нақтылаңыз.'],['Учебная, 8, подъезд 2. В кабине один человек.','Оқу көшесі, 8, 2-кіреберіс. Кабинада бір адам бар.'],['Зафиксируйте место и передайте по утверждённому срочному сценарию.','Орынды тіркеп, бекітілген шұғыл тәртіппен жолдаңыз.'],1,1,2],

function knowledge(){return '<h1>'+L('База знаний','Білім базасы')+'</h1><label>'+L('Поиск по теме или фразе жителя','Тақырып немесе тұрғын сөзі бойынша іздеу')+'<input id="search" type="search" value="'+esc(query)+'" placeholder="'+L('Например, нет воды','Мысалы, су жоқ')+'"></label><div id="results">'+kbList()+'</div><details class="card"><summary>'+L('Материалы центра','Орталық материалдары')+'</summary><p>'+L('Локальная загрузка утверждённых файлов. Используйте только материалы для обучения.','Бекітілген файлдарды жергілікті жүктеу. Тек оқу материалдарын пайдаланыңыз.')+'</p><input id="materials" aria-label="'+L('Добавить материалы','Материал қосу')+'" type="file" accept=".pdf,.txt,.docx" multiple><p id="upload-status" role="status"></p><ul>'+s.materials.map(m=>'<li><a download="'+esc(m.name)+'" href="'+esc(m.url)+'">'+esc(m.name)+'</a></li>').join('')+'</ul></details>'}
function exercise(i,isExam){let c=cases[i], draft=feedback?.draft||{};return (isExam?'<small>'+L('Учебная смена','Оқу ауысымы')+' · '+(s.attempt.answers.length+1)+' / 4</small>':btn(L('Все кейсы','Барлық жаттығулар'),'page2'))+'<h1>'+T(c[0])+'</h1><div class="grid"><section class="card exercise-top"><h2>'+L('Диалог','Диалог')+'</h2><p>'+T(c[2])+'</p>'+btn(T(c[3]),'clarify')+'<p id="reply" aria-live="polite">'+(clarified?T(c[4]):'')+'</p><details><summary>'+L('База знаний','Білім базасы')+'</summary>'+(isExam?cases.map(k=>'<details><summary>'+T(k[1])+'</summary>'+kb(k)+'</details>').join(''):kb(c))+'</details></section><section class="card"><h2>'+L('Учебная карточка','Оқу карточкасы')+'</h2><form id="case-form" data-case="'+i+'"><fieldset '+(feedback?'disabled':'')+' style="border:0;padding:0;margin:0;min-width:0"><label>'+L('Категория','Санат')+'<select name="category" required><option value="">'+L('Выберите','Таңдаңыз')+'</option>'+options(cats)+'</select></label><label class="row"><input type="checkbox" name="urgent"> '+L('Есть признаки угрозы жизни или здоровью','Өмірге немесе денсаулыққа қауіп белгісі бар')+'</label><label>'+L('Краткая запись','Қысқаша жазба')+'<textarea name="note" required minlength="10">'+esc(draft.note||'')+'</textarea></label><label>'+L('Дальнейшее действие','Келесі әрекет')+'<select name="action" required><option value="">'+L('Выберите','Таңдаңыз')+'</option>'+options(actions)+'</select></label><button class="primary">'+(isExam?L('Сохранить ответ','Жауапты сақтау'):L('Проверить решение','Шешімді тексеру'))+'</button></fieldset></form></section></div>'+(feedback?report([feedback])+btn(L('Повторить кейс','Қайта өту'),'case'+i,true):'')}
const skills=[['Уточнение','Нақтылау'],['Категория','Санат'],['Критичность','Шұғылдық'],['Действие','Әрекет']];
function report(list){return '<div class="card"><h2>'+L('Разбор решений','Шешімдерді талдау')+'</h2>'+list.map(r=>'<h3>'+T(cases[r.i][0])+'</h3><ul>'+r.checks.map((ok,j)=>'<li class="'+(ok?'good':'bad')+'">'+T(skills[j])+' — '+(ok?L('верно','дұрыс'):L('требует повторения','қайталау қажет'))+(!ok?' · '+[T(cases[r.i][3]),T(cats[cases[r.i][6]]),cases[r.i][7]?L('отметьте угрозу','қауіпті белгілеңіз'):L('угроза в кейсе не указана','қауіп көрсетілмеген'),T(actions[cases[r.i][8]])][j]:'')+'</li>').join('')+'</ul>'+(r.critical?'<p class="bad">'+L('Критическая ошибка: срочное обращение обработано неверно.','Маңызды қате: шұғыл өтініш қате өңделді.')+'</p>':'')+'<details><summary>'+L('Материал для повторения','Қайталау материалы')+'</summary>'+kb(cases[r.i])+'</details>'+btn(L('Открыть практику','Жаттығуды ашу'),'case'+r.i)).join('')+'<small>'+L('Содержание краткой записи можно сверить с фактами диалога. Автоматически оцениваются выборы и уточнение.','Жазбаны диалог фактілерімен салыстырыңыз. Таңдаулар мен нақтылау автоматты бағаланады.')+'</small></div>'}

function refresh(){render();if(feedback&&page===2){let form=document.querySelector('#case-form');form.elements.category.value=feedback.draft.category;form.elements.urgent.checked=feedback.draft.urgent;form.elements.action.value=feedback.draft.action}if(page===2&&active===null){document.querySelector('#filter').value=filter;document.querySelector('#difficulty').value=difficulty}}
document.addEventListener('click',e=>{let a=e.target.closest('[data-go]')?.dataset.go;if(!a)return;
if(a.startsWith('page')){page=+a.slice(4);lesson=null;active=null;feedback=null;clarified=false;nav.classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false')}
else if(a.startsWith('lesson')){page=1;lesson=+a.slice(6);s.started=true;s.lesson=lesson;lessonAnswer=null;save()}
else if(a.startsWith('answer'))lessonAnswer=+a.slice(6);
else if(a==='finishlesson'){if(!s.done.includes(lesson))s.done.push(lesson);lesson=modules.findIndex((_,i)=>!s.done.includes(i));s.lesson=lesson<0?5:lesson;if(lesson<0){page=4;lesson=null}lessonAnswer=null;save()}
else if(a.startsWith('case')){page=2;active=+a.slice(4);clarified=false;feedback=null}
else if(a==='clarify'){clarified=true;document.querySelector('#reply').textContent=T(cases[+document.querySelector('#case-form').dataset.case][4]);return}
else if(a==='startexam'){s.attempt={answers:[]};clarified=false;save()}
refresh();if(!a.startsWith('answer'))window.scrollTo(0,0);
});
document.addEventListener('submit',e=>{if(e.target.id!=='case-form')return;e.preventDefault();let form=e.target,i=+form.dataset.case,c=cases[i],d=new FormData(form),draft={category:d.get('category'),action:d.get('action'),urgent:d.has('urgent'),note:d.get('note')};if(draft.note.trim().length<10){form.elements.note.focus();return}let checks=[clarified,+draft.category===c[6],+draft.urgent===c[7],+draft.action===c[8]],r={i,checks,critical:Boolean(c[7]&&(!checks[2]||!checks[3])),draft};s.review=s.review.filter(x=>x!==i);if(checks.includes(false))s.review.push(i);if(page===4){s.attempt.answers.push(r);if(s.attempt.answers.length===examIds.length){let answers=s.attempt.answers;s.result={answers,pass:answers.every(x=>!x.critical)&&answers.flatMap(x=>x.checks).filter(Boolean).length>=13};s.attempt=null}clarified=false}else feedback=r;save();refresh();});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('#results').innerHTML=kbList()}});
document.addEventListener('change',async e=>{if(e.target.id==='filter'){filter=e.target.value;refresh()}if(e.target.id==='difficulty'){difficulty=e.target.value;refresh()}if(e.target.id==='materials'){let before=s.materials.slice();try{for(let file of e.target.files){if(file.size>1500000||!(/\.(pdf|docx|txt)$/i.test(file.name)))throw Error();let bytes=new Uint8Array(await file.arrayBuffer()), chunks=[];for(let i=0;i<bytes.length;i+=8192)chunks.push(String.fromCharCode(...bytes.slice(i,i+8192)));s.materials.push({name:file.name,url:'data:application/octet-stream;base64,'+btoa(chunks.join(''))})}save();refresh()}catch{s.materials=before;document.querySelector('#upload-status').textContent=L('Файл не сохранён. Допустимы PDF, DOCX и TXT до 1,5 МБ при наличии места в браузере.','Файл сақталмады. Бос орын болса, 1,5 МБ дейінгі PDF, DOCX және TXT файлдары қабылданады.')}}});

const previousRender=render, previousRefresh=refresh, previousExercise=exercise, previousKnowledge=knowledge, previousList=kbList, previousReport=report;
let knowledgeTopic='', restoring=false;
s.drafts??={};
function draftKey(form){return (page===4?'assessment:':'practice:')+form.dataset.case}

exercise=function(i,isExam){return previousExercise(i,isExam).replace('<div class="grid">','<div class="grid case-layout">').replace('<p>'+T(cases[i][2])+'</p>','<p class="resident">'+T(cases[i][2])+'</p>').replace('<details><summary>','<details class="reference-panel"><summary>').replace('</h1>','</h1><p class="muted">'+L('Учебная ситуация','Оқу жағдайы')+(isExam?' · '+L('Осталось ситуаций','Қалған жағдайлар')+' '+(examIds.length-s.attempt.answers.length):'')+'</p>')+(feedback?'<div class="row">'+btn(L('Следующий кейс','Келесі жаттығу'),'case'+((i+1)%cases.length),true)+btn(L('Вернуться к заданиям','Тапсырмаларға оралу'),'page2')+'</div>':'')};
report=function(list){const html=previousReport(list);return '<div class="metrics skill-summary">'+skills.map((skill,i)=>'<div class="metric"><strong>'+list.filter(r=>r.checks[i]).length+' / '+list.length+'</strong><span>'+T(skill)+'</span></div>').join('')+'</div>'+html};
kbList=function(){const ids=cases.map((c,i)=>i).filter(i=>(!knowledgeTopic||T(cases[i][1])===knowledgeTopic)&&matches(cases[i],i)&&(!onlySaved||s.bookmarks.includes(i)));return ids.length?ids.map(i=>{const c=cases[i];return '<article class="card kb-entry"><div class="row spread"><small class="tag">'+T(c[1])+'</small>'+btn(s.bookmarks.includes(i)?L('Убрать закладку','Бетбелгіні өшіру'):L('В закладки','Бетбелгіге қосу'),'mark'+i)+'</div><h3>'+T(c[0])+'</h3><p class="muted">'+T(c[3])+'</p><details><summary>'+L('Открыть карточку','Карточканы ашу')+'</summary>'+kb(c)+'</details>'+btn(L('Решить связанный кейс','Осы жаттығуды орындау'),'case'+i)+'</article>'}).join(''):'<div class="card"><h3>'+L('Карточки не найдены','Карточкалар табылмады')+'</h3><p>'+L('Измените запрос или выберите другую тему.','Сұрауды өзгертіңіз немесе басқа тақырыпты таңдаңыз.')+'</p>'+btn(L('Очистить поиск и тему','Іздеу мен тақырыпты тазарту'),'resetkb')+'</div>'};
knowledge=function(){return previousKnowledge().replace('<div id="results">','<label class="topic-filter">'+L('Тема','Тақырып')+'<select id="kb-topic"><option value="">'+L('Все темы','Барлық тақырыптар')+'</option>'+[...new Set(cases.map(c=>T(c[1])))].map(t=>'<option '+(t===knowledgeTopic?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><div id="results" class="grid kb-grid">')};
document.addEventListener('input',e=>{if(e.target.form?.id==='case-form'&&!feedback)cacheDraft(e.target.form)});
document.addEventListener('change',e=>{if(e.target.id==='kb-topic'){knowledgeTopic=e.target.value;document.querySelector('#results').innerHTML=kbList()}else if(e.target.form?.id==='case-form'&&!feedback)cacheDraft(e.target.form)});
document.addEventListener('click',e=>{const action=e.target.closest('[data-go]')?.dataset.go;if(action==='clarify'){const form=document.querySelector('#case-form');if(form&&!feedback)cacheDraft(form)}if(action==='resetkb'){query='';knowledgeTopic='';refresh()}if(e.target.closest('#language')){knowledgeTopic='';if(page===3)refresh()}});
document.addEventListener('submit',e=>{if(e.target.id==='case-form'&&e.target.elements.note.value.trim().length>=10){delete s.drafts[draftKey(e.target)];save()}},true);
window.addEventListener('hashchange',openRoute);
if(location.hash.startsWith('#/'))openRoute();else{history.replaceState(null,'','#/home');refresh()}

const baseCourse=course, baseHome=home;
s.lessonNotes??={};
function studyPanel(){
 return '<section class="card study-panel"><h2>'+L('План курса','Оқу жоспары')+'</h2><progress max="6" value="'+s.done.length+'" aria-label="'+L('Прогресс','Оқу барысы')+'"></progress><p class="muted">'+s.done.length+' / 6</p><ol>'+modules.map((m,i)=>'<li><button data-go="lesson'+i+'" '+(lesson===i?'aria-current="step"':'')+'><span>'+T(m[0])+'</span><small>'+(s.done.includes(i)?L('Пройден','Аяқталды'):lesson===i?L('Текущий урок','Ағымдағы сабақ'):L('Доступен','Қолжетімді'))+'</small></button></li>').join('')+'</ol></section>';
}
course=function(){
 const content=baseCourse();
 if(lesson===null)return content;
 return '<div class="study-layout"><div>'+content+'<details class="card study-notes"><summary>'+L('Мои заметки к уроку','Сабақ бойынша жазбаларым')+'</summary><label>'+L('Заметка сохраняется в этом браузере','Жазба осы браузерде сақталады')+'<textarea id="lesson-note" maxlength="2000">'+esc(s.lessonNotes[lesson]||'')+'</textarea></label><span id="note-status" role="status"></span></details></div>'+studyPanel()+'</div>';
};
home=function(){
 const html=baseHome();
 if(!s.review.length)return html;
 const i=s.review[0];
 return html.replace('</section>','</section><section class="card recommended"><div><h2>'+L('Рекомендуем повторить','Қайталауға ұсынылады')+'</h2><p>'+T(cases[i][0])+'</p></div>'+btn(L('Разобрать и повторить','Талдап қайталау'),'case'+i)+'</section>');
};
document.addEventListener('input',event=>{
 if(event.target.id==='lesson-note'&&lesson!==null){
  s.lessonNotes[lesson]=event.target.value;
  save();
  document.querySelector('#note-status').textContent=L('Сохранено','Сақталды');
 }
});
refresh();
</script></html>
